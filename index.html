<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tropikal Ada</title>
<style>
  :root { --panel: rgba(10, 30, 45, 0.72); --ink: #eaf7ff; --accent: #3fe0d0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3f4; font-family: system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; }
  #ui { position: fixed; left: 16px; bottom: 16px; background: var(--panel); padding: 12px 14px; border-radius: 12px; max-width: 280px; backdrop-filter: blur(6px); }
  #ui h1 { margin: 0 0 6px; font-size: 15px; letter-spacing: .02em; }
  #ui p { margin: 0 0 10px; font-size: 12px; opacity: .8; }
  #ui button { background: transparent; color: var(--ink); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 10px; margin: 0 6px 6px 0; cursor: pointer; font-size: 12px; }
  #ui button.on { background: var(--accent); color: #062a33; }
  #part { font-size: 13px; color: var(--accent); min-height: 18px; }
</style>
</head>
<body>
<div id="ui">
  <h1>Tropikal Ada</h1>
  <p>Sürükle: döndür · Tekerlek: yakınlaş · Parçaya tıkla: adını gör</p>
  <button id="explode">Parçalara ayır</button>
  <button id="spin" class="on">Otomatik dönüş</button>
  <div id="part">&nbsp;</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- deterministic noise (seeded, so every load builds the same island) ----------
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(1907);
const perm = new Uint8Array(512); { const p = [...Array(256).keys()]; const r = mulberry32(42); for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const hash = (x, z) => perm[(perm[x & 255] + z) & 511] / 255;
const fade = t => t * t * (3 - 2 * t);
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  const u = fade(xf), v = fade(zf);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm(x, z) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < 5; i++) { s += a * vnoise(x * f, z * f); f *= 2; a *= 0.5; } return s; }
const smooth = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

// Island height field. Water surface is y = 0.
const ISLAND_R = 17;
function heightAt(x, z) {
  const r = Math.hypot(x, z);
  const n = fbm(x * 0.05 + 10, z * 0.05 + 10);
  const base = 1 - r / (ISLAND_R * (0.75 + 0.5 * n));       // >0 inside the wobbly coastline
  let h = -3 + 4.2 * smooth(-0.35, 0.3, base);                // seafloor -> beach shelf
  h += 1.2 * smooth(0.2, 0.6, base);                          // inland rise
  const hill = Math.exp(-((x - 3) ** 2 + (z + 3) ** 2) / 38); // volcanic hill off-centre
  h += 7.5 * hill * smooth(0.1, 0.5, base);
  h += 0.9 * (fbm(x * 0.18, z * 0.18) - 0.5) * smooth(0.15, 0.5, base);
  return h;
}

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe9ff, 90, 240);   // must close before the water plane's edge (r=260)
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1200);
camera.position.set(38, 22, 42);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 10; controls.maxDistance = 160;
controls.autoRotate = true; controls.autoRotateSpeed = 0.6;

// Sky dome: vertical gradient, horizon haze matches the fog colour.
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x2f86d6) }, bottom: { value: new THREE.Color(0xbfe9ff) } },
  vertexShader: 'varying float vy; void main(){ vy = normalize(position).y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying float vy; void main(){ gl_FragColor = vec4(mix(bottom, top, pow(max(vy,0.),0.6)),1.); }'
}));
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xcdefff, 0xe8d3a0, 0.9));
const sunDir = new THREE.Vector3(-0.6, 0.75, 0.35).normalize();
const sun = new THREE.DirectionalLight(0xfff1d6, 2.4);
sun.position.copy(sunDir).multiplyScalar(60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 140 });
sun.shadow.bias = -0.0005;
scene.add(sun);

// ---------- parts registry (explodable + clickable) ----------
const parts = [];
function addPart(group, name, explodeOffset) {
  group.userData.partName = name;
  group.userData.home = group.position.clone();
  group.userData.explode = explodeOffset;
  parts.push(group); scene.add(group);
  return group;
}
const radialOut = (p, dist, up) => new THREE.Vector3(p.x, 0, p.z).normalize().multiplyScalar(dist).setY(up);

// ---------- terrain ----------
{
  const size = 70, seg = 220;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, cols = [];
  const cWet = new THREE.Color(0xc9a66b), cSand = new THREE.Color(0xf2dca4), cGrass = new THREE.Color(0x4f9a3a),
        cJungle = new THREE.Color(0x2f6f2a), cRock = new THREE.Color(0x7a7266), cFloor = new THREE.Color(0x0b3a5c), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = heightAt(x, z);
    pos.setY(i, h);
    const slope = Math.hypot(heightAt(x + 0.3, z) - h, heightAt(x, z + 0.3) - h) / 0.3;
    if (h < 0.15) c.copy(cWet).lerp(cSand, smooth(-2, 0.15, h));
    else if (h < 1.0) c.copy(cSand);
    else c.copy(cSand).lerp(cGrass, smooth(1.0, 1.5, h)).lerp(cJungle, smooth(2.5, 5, h) * 0.8);
    if (h > 3 && slope > 0.9) c.lerp(cRock, smooth(0.9, 1.6, slope));
    const j = 0.94 + 0.12 * vnoise(x * 2.3, z * 2.3); c.multiplyScalar(j);
    c.lerp(cFloor, smooth(-1.8, -2.9, h));             // fade into the deep seafloor so the terrain square never shows
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 }));
  mesh.receiveShadow = true; mesh.castShadow = true;
  const g = new THREE.Group(); g.add(mesh);
  addPart(g, 'Ada gövdesi (kum, çimen, tepe)', new THREE.Vector3(0, 0, 0));

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: 0x0b3a5c, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -3.05; scene.add(floor);
}

// ---------- ocean ----------
const water = (() => {
  const geo = new THREE.PlaneGeometry(520, 520, 200, 200); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, cols = [];
  const shallow = new THREE.Color(0x48e3cf), mid = new THREE.Color(0x1aa3c4), deep = new THREE.Color(0x0b4f8f), foam = new THREE.Color(0xf4ffff), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const depth = -heightAt(pos.getX(i), pos.getZ(i));
    c.copy(shallow).lerp(mid, smooth(0.3, 1.6, depth)).lerp(deep, smooth(1.6, 3, depth));
    if (depth < 0.25) c.lerp(foam, smooth(0.25, -0.05, depth) * 0.8);   // foam line at the shore
    cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, transparent: true, opacity: 0.82, roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.1 });
  const mesh = new THREE.Mesh(geo, mat); mesh.receiveShadow = true;
  const g = new THREE.Group(); g.add(mesh);
  addPart(g, 'Okyanus (lagün + derin su)', new THREE.Vector3(0, -6, 0));
  return { geo, base: Float32Array.from(pos.array) };
})();

// ---------- palm trees ----------
const barkA = new THREE.MeshStandardMaterial({ color: 0x8a6239, roughness: 1 });
const barkB = new THREE.MeshStandardMaterial({ color: 0x6f4d2c, roughness: 1 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f9b3a, roughness: 0.7, side: THREE.DoubleSide });
const leafMatDry = new THREE.MeshStandardMaterial({ color: 0x7fa83a, roughness: 0.8, side: THREE.DoubleSide });
const nutMat = new THREE.MeshStandardMaterial({ color: 0x5a3b1c, roughness: 0.8 });

function frondGeometry(len, droop) {
  // Spine arcs up then droops; blade folds into a shallow V with serrated edges.
  const segs = 16, P = [], I = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, x = t * len, y = 0.45 * len * t * (1 - t) - droop * t * t;
    let w = 0.55 * Math.sin(Math.PI * Math.min(1, t * 1.08)) * (1 - 0.35 * t);
    if (i % 2) w *= 0.7;
    const fold = w * 0.4;
    P.push(x, y - fold, -w, x, y, 0, x, y - fold, w);
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 3, b = a + 3;
    I.push(a, b, a + 1, a + 1, b, b + 1, a + 1, b + 1, a + 2, a + 2, b + 1, b + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setIndex(I); g.computeVertexNormals();
  return g;
}

const swayers = [];
const HUT = findSpot(1.3, 1.8, 2.2);   // reserved before palms are scattered, so none lands on the hut
function makePalm(height, leanAngle, lean) {
  const g = new THREE.Group();
  const p = t => new THREE.Vector3(lean * t * t * Math.cos(leanAngle), height * t, lean * t * t * Math.sin(leanAngle));
  const n = 12, up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < n; i++) {
    const a = p(i / n), b = p((i + 1) / n), d = b.clone().sub(a), L = d.length();
    const r = 0.34 - 0.14 * (i / n);
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.82, r, L * 1.02, 10), i % 2 ? barkA : barkB);
    seg.position.copy(a).add(b).multiplyScalar(0.5);
    seg.quaternion.setFromUnitVectors(up, d.normalize());
    seg.castShadow = true; g.add(seg);
  }
  const crown = new THREE.Group(); crown.position.copy(p(1)); g.add(crown);
  const count = 9 + Math.floor(rng() * 3);
  for (let i = 0; i < count; i++) {
    const f = new THREE.Mesh(frondGeometry(3.2 + rng() * 1.2, 1.4 + rng() * 1.2), rng() < 0.2 ? leafMatDry : leafMat);
    f.rotation.y = (i / count) * Math.PI * 2 + rng() * 0.4;
    f.rotation.z = 0.15 + rng() * 0.35;
    f.castShadow = true; crown.add(f);
  }
  for (let i = 0; i < 4; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), nutMat);
    const a = i * Math.PI / 2 + 0.4; c.position.set(Math.cos(a) * 0.28, -0.3, Math.sin(a) * 0.28);
    c.castShadow = true; crown.add(c);
  }
  swayers.push({ crown, phase: rng() * 6.28, amp: 0.04 + rng() * 0.04 });
  return g;
}

{
  let placed = 0, tries = 0;
  const spots = [];
  while (placed < 16 && tries++ < 3000) {
    const a = rng() * Math.PI * 2, r = rng() * ISLAND_R;
    const x = Math.cos(a) * r, z = Math.sin(a) * r, h = heightAt(x, z);
    const beach = h > 0.5 && h < 1.4, inland = h > 1.4 && h < 4;
    if (!(beach || inland)) continue;
    if (spots.some(s => Math.hypot(s.x - x, s.z - z) < 3.2)) continue;
    if (Math.hypot(x - HUT.x, z - HUT.z) < 4) continue;
    spots.push({ x, z });
    // Beach palms lean out toward the water, like real coconut palms.
    const palm = makePalm(5.5 + rng() * 3, Math.atan2(z, x) + (rng() - 0.5) * 0.6, beach ? 1.6 + rng() * 1.6 : rng() * 0.8);
    palm.position.set(x, h - 0.15, z);
    addPart(palm, `Palmiye ${++placed}`, radialOut(palm.position, 6, 4));
  }
}

// ---------- hut ----------
function findSpot(minH, maxH, startAngle) {
  for (let a = startAngle; a < startAngle + Math.PI * 2; a += 0.05)
    for (let r = ISLAND_R; r > 2; r -= 0.25) {
      const x = Math.cos(a) * r, z = Math.sin(a) * r, h = heightAt(x, z);
      if (h > minH && h < maxH) return { x, z, h, a };
    }
}
{
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0x9b7348, roughness: 0.9 });
  const straw = new THREE.MeshStandardMaterial({ color: 0xd8b55e, roughness: 1, flatShading: true });
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 1.4, 8), wood);
    post.position.set(sx * 1.2, 0.5, sz * 1.0); post.castShadow = true; g.add(post);
  }
  const floor = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.15, 2.4), wood); floor.position.y = 1.15; g.add(floor);
  const walls = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.4, 2.0), new THREE.MeshStandardMaterial({ color: 0xc89b62, roughness: 1 }));
  walls.position.y = 1.9; walls.castShadow = true; g.add(walls);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.05), new THREE.MeshStandardMaterial({ color: 0x3b2614 }));
  door.position.set(0, 1.72, 1.03); g.add(door);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.3, 1.7, 4, 3), straw);
  roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 0.9); roof.position.y = 3.4; roof.castShadow = true; g.add(roof);
  g.position.set(HUT.x, HUT.h - 0.1, HUT.z);
  g.rotation.y = -HUT.a + Math.PI / 2;                 // door faces the sea
  addPart(g, 'Kulübe', radialOut(g.position, 5, 6));
}

// ---------- dock ----------
{
  const s = findSpot(0.2, 0.6, 2.2 + 0.5);
  const g = new THREE.Group(), wood = new THREE.MeshStandardMaterial({ color: 0x8c6a45, roughness: 0.95 });
  const L = 9;
  for (let i = 0; i < 18; i++) {
    const plank = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.08, 1.8), wood);
    plank.position.set(i * 0.5, 0.75, 0); plank.rotation.y = (rng() - 0.5) * 0.04;
    plank.castShadow = true; plank.receiveShadow = true; g.add(plank);
  }
  for (let i = 0; i <= 4; i++) for (const sz of [-0.8, 0.8]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 3.6, 8), wood);
    post.position.set(i * (L / 4) - 0.2, -1.0, sz); g.add(post);
  }
  g.position.set(s.x, 0, s.z);
  g.rotation.y = -s.a;                                // runs straight out from the shore
  addPart(g, 'İskele', radialOut(g.position, 6, 3));

  // canoe tied at the end of the dock
  const boat = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 10, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xc0462f, roughness: 0.6, side: THREE.DoubleSide }));
  hull.scale.set(2.0, 0.45, 0.55); boat.add(hull);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.05, 6, 32), new THREE.MeshStandardMaterial({ color: 0xf1e6cc }));
  rim.rotation.x = Math.PI / 2; rim.scale.set(2.0, 0.55, 1); boat.add(rim);
  boat.traverse(o => o.castShadow = true);
  const end = new THREE.Vector3(L - 1, 0, 1.9).applyAxisAngle(new THREE.Vector3(0, 1, 0), -s.a).add(g.position);
  boat.position.set(end.x, 0.15, end.z); boat.rotation.y = -s.a;
  addPart(boat, 'Kano', radialOut(boat.position, 6, 2));
  swayers.push({ boat, phase: 1 });
}

// ---------- rocks ----------
{
  const g = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: 0x77736b, roughness: 0.9, flatShading: true });
  let n = 0, tries = 0;
  while (n < 14 && tries++ < 2000) {
    const a = rng() * Math.PI * 2, r = rng() * (ISLAND_R + 3);
    const x = Math.cos(a) * r, z = Math.sin(a) * r, h = heightAt(x, z);
    if (!((h > -0.8 && h < 0.4) || h > 5)) continue;
    const geo = new THREE.DodecahedronGeometry(0.5 + rng() * 1.1, 1);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) { const k = 0.8 + 0.4 * vnoise(p.getX(i) * 3 + n, p.getZ(i) * 3); p.setXYZ(i, p.getX(i) * k, p.getY(i) * k * 0.7, p.getZ(i) * k); }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat); m.position.set(x, h + 0.1, z); m.rotation.y = rng() * 6;
    m.castShadow = m.receiveShadow = true; g.add(m); n++;
  }
  addPart(g, 'Kayalar', new THREE.Vector3(0, 5, 0));
}

// ---------- clouds ----------
const clouds = new THREE.Group();
{
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xdfefff, emissiveIntensity: 0.25 });
  for (let c = 0; c < 7; c++) {
    const cl = new THREE.Group();
    for (let i = 0; i < 5 + Math.floor(rng() * 4); i++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(2 + rng() * 2.5, 16, 12), mat);
      s.position.set(i * 2.6 - 6, rng() * 1.5, (rng() - 0.5) * 3); s.scale.y = 0.65; cl.add(s);
    }
    const a = rng() * Math.PI * 2, r = 45 + rng() * 60;
    cl.position.set(Math.cos(a) * r, 28 + rng() * 14, Math.sin(a) * r);
    clouds.add(cl);
  }
  addPart(clouds, 'Bulutlar', new THREE.Vector3(0, 15, 0));
}

// ---------- sun disc ----------
{
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff4c4, fog: false })));
  g.position.copy(sunDir).multiplyScalar(380);
  addPart(g, 'Güneş', new THREE.Vector3(0, 0, 0));
}

// ---------- interaction ----------
const ui = { part: document.getElementById('part'), explode: document.getElementById('explode'), spin: document.getElementById('spin') };
let exploded = 0, explodeTarget = 0;
ui.explode.onclick = () => { explodeTarget = 1 - explodeTarget; ui.explode.classList.toggle('on', !!explodeTarget); ui.explode.textContent = explodeTarget ? 'Birleştir' : 'Parçalara ayır'; };
ui.spin.onclick = () => { controls.autoRotate = !controls.autoRotate; ui.spin.classList.toggle('on', controls.autoRotate); };

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let selBox = null, downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;   // ignore drags
  mouse.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(parts, true)[0];
  if (selBox) { scene.remove(selBox); selBox = null; }
  if (!hit) { ui.part.innerHTML = '&nbsp;'; return; }
  let o = hit.object; while (o && !o.userData.partName) o = o.parent;
  ui.part.textContent = o.userData.partName;
  if (o.userData.partName.startsWith('Ada') || o.userData.partName.startsWith('Okyanus')) return;
  selBox = new THREE.BoxHelper(o, 0xffe066); scene.add(selBox);
});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime(), dt = Math.min(clock.getDelta(), 0.05);

  const pos = water.geo.attributes.position, b = water.base;
  for (let i = 0; i < pos.count; i++) {
    const x = b[i * 3], z = b[i * 3 + 2];
    pos.array[i * 3 + 1] = 0.14 * Math.sin(x * 0.25 + t * 1.1) + 0.09 * Math.sin(z * 0.33 + t * 1.5) + 0.05 * Math.sin((x + z) * 0.7 + t * 2.2);
  }
  pos.needsUpdate = true; water.geo.computeVertexNormals();

  for (const s of swayers) {
    if (s.crown) { s.crown.rotation.z = Math.sin(t * 1.3 + s.phase) * s.amp; s.crown.rotation.x = Math.cos(t * 0.9 + s.phase) * s.amp * 0.6; }
    if (s.boat) { s.boat.position.y = s.boat.userData.home.y + 0.08 * Math.sin(t * 1.6) + exploded * s.boat.userData.explode.y; s.boat.rotation.z = 0.05 * Math.sin(t * 1.2); }
  }
  clouds.rotation.y = t * 0.01;

  exploded += (explodeTarget - exploded) * 0.08;
  for (const p of parts) if (!p.userData.partName.startsWith('Kano'))
    p.position.copy(p.userData.home).addScaledVector(p.userData.explode, exploded);
  if (parts.find(p => p.userData.partName === 'Kano')) {
    const k = parts.find(p => p.userData.partName === 'Kano');
    k.position.x = k.userData.home.x + k.userData.explode.x * exploded;
    k.position.z = k.userData.home.z + k.userData.explode.z * exploded;
  }
  if (selBox) selBox.update();

  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
